<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" />
    <title>Gin 500</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #fbfaf8;
            --card: #fff;
            --navy: #071b35;
            --red: #b5231d;
            --gold: #a88645;
            --muted: #737b86;
            --line: #e3e5e8;
            --soft: #f5f6f7;
            --shadow: 0 8px 28px rgba(7, 27, 53, .07);
            --radius: 18px
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background: var(--bg);
            color: var(--navy)
        }

        html {
            touch-action: pan-y
        }

        body {
            font-family: Inter, system-ui, sans-serif
        }

        button,
        input {
            font: inherit
        }

        button {
            cursor: pointer;
            color: inherit
        }

        .hidden {
            display: none !important
        }

        .app {
            width: min(100%, 760px);
            min-height: 100vh;
            margin: auto;
            padding: max(18px, env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))
        }

        .topbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 92px;
            padding: 0 58px 8px
        }

        .brand {
            text-align: center;
            line-height: .8
        }

        .brand-suits {
            font-size: 16px;
            letter-spacing: 4px;
            text-align: center;
            margin: 0 0 3px 9px
        }

        .brand-suits .red {
            color: var(--red)
        }

        .brand-name {
            font-family: "Cormorant Garamond", serif;
            font-size: 57px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: -2px
        }

        .brand-name .red {
            color: var(--red)
        }

        .brand-sub {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 4px
        }

        .brand-sub:before,
        .brand-sub:after {
            content: "";
            width: 22px;
            height: 1px;
            background: var(--gold)
        }

        .menu-button {
            position: absolute;
            right: 2px;
            top: 4px;
            width: 50px;
            height: 50px;
            border: 0;
            background: transparent;
            border-radius: 50%;
            font-size: 32px
        }

        .menu-button:hover {
            background: var(--soft)
        }

        .game-menu {
            position: absolute;
            z-index: 50;
            right: 4px;
            top: 55px;
            width: 220px;
            padding: 8px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow)
        }

        .game-menu button {
            display: block;
            width: 100%;
            padding: 11px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            text-align: left;
            font-family: Inter, system-ui, sans-serif;
            font-size: 14px;
            font-weight: 500;
            font-style: normal;
            text-transform: uppercase
        }

        .game-menu button:hover {
            background: var(--soft)
        }

        .game-menu .danger {
            color: var(--red)
        }

        .menu-divider {
            height: 1px;
            background: var(--line);
            margin: 5px
        }

        .page {
            display: none
        }

        .page.active {
            display: block
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow)
        }

        .section-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase
        }

        .muted {
            color: var(--muted)
        }

        /* SCORECARD */
        .page-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 5px 2px 14px
        }

        .heading-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .game-timer {
            border: 0;
            padding: 7px 4px;
            background: transparent;
            color: var(--navy);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .04em;
            white-space: nowrap;
            cursor: pointer;
        }

        .wager-display {
            border: 0;
            border-radius: 9px;
            padding: 7px 10px;
            background: var(--soft);
            color: var(--navy);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .04em;
            white-space: nowrap;
        }

        .wager-display:not(:disabled) {
            cursor: pointer;
        }

        .wager-display.locked {
            color: var(--muted);
            opacity: .72;
            cursor: default;
        }

        .wager-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .wager-type {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--soft);
            color: var(--navy);
            font-weight: 800;
        }

        .wager-type.active {
            box-shadow: inset 0 0 0 2px var(--gold);
        }

        .wager-amount-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .wager-dollar {
            font-size: 22px;
            font-weight: 800;
        }

        .wager-amount {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--card);
            color: var(--navy);
            font-size: 18px;
            font-weight: 800;
            outline: none;
        }

        .wager-save {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 9px;
            background: var(--navy);
            color: var(--card);
            font-weight: 800;
        }

        .winner-popup {
            text-align: center;
        }

        .winner-title {
            margin: 4px 0 2px;
            color: var(--red);
            font-family: "Cormorant Garamond", serif;
            font-size: 34px;
            line-height: 1;
            font-weight: 700;
            font-style: italic;
        }

        .winner-score {
            margin-bottom: 18px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .winner-money {
            margin: 12px 0 18px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--soft);
        }

        .winner-money-label {
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .winner-money-total {
            color: var(--gold);
            font-size: 30px;
            font-weight: 800;
        }

        .settlement-title {
            margin: 16px 0 7px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .settlement-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 2px;
            border-top: 1px solid var(--line);
            font-size: 13px;
        }

        .settlement-row strong {
            white-space: nowrap;
        }

        .winner-done {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: var(--navy);
            color: var(--card);
            font-weight: 800;
        }

        .eyebrow {
            font-family: "Cormorant Garamond", serif;
            font-size: 30px;
            line-height: 34px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: -.4px
        }

        .scorecard-wrapper {
            overflow: hidden
        }

        .score-horizontal-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch
        }

        .scorecard-inner {
            min-width: 100%
        }

        .scorecard-inner.wide {
            min-width: calc(40px + (var(--player-count) * 92px))
        }

        .score-scroll-area {
            overflow: visible;
            max-height: none;
            min-height: 0
        }

        .player-grid,
        .hand-row,
        .total-row {
            display: grid;
            grid-template-columns: 40px repeat(var(--player-count), minmax(0, 1fr))
        }

        .player-grid {
            background: #fff;
            border-bottom: 1px solid var(--line)
        }

        .round-head,
        .player-header {
            padding: 14px 5px;
            text-align: center;
            font-size: 11px;
            font-weight: 800
        }

        .player-header {
            border-left: 1px solid var(--line);
            min-width: 0;
            cursor: pointer
        }

        .player-name-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 0;
            height: 26px;
        }

        .player-name-text {
            display: block;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            white-space: nowrap;
            font-size: 14px;
            line-height: 1.1;
            font-weight: 800
        }



        .player-header:hover {
            background: var(--soft)
        }

        .player-header.winner {
            color: var(--red);
            background: #fff5f3
        }

        .hand-row {
            border-bottom: 1px solid var(--line)
        }

        .round-number {
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700
        }

        .score-cell-wrap {
            position: relative;
            min-width: 0;
            height: 53px;
            background: #fff;
        }

        .hand-payout {
            position: absolute;
            z-index: 3;
            top: 4px;
            right: 5px;
            pointer-events: none;
            color: var(--gold);
            font-size: 11px;
            line-height: 1;
            font-weight: 600;
            opacity: .95;
        }

        .score-cell {
            display: block;
            width: 100%;
            min-width: 0;
            height: 53px;
            padding: 0;
            border: 0;
            border-left: 1px solid var(--line);
            background: transparent;
            color: var(--navy);
            text-align: center;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            -moz-appearance: textfield;
        }

        .score-cell::-webkit-inner-spin-button,
        .score-cell::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0
        }

        .score-cell:focus {
            position: relative;
            z-index: 2;
            box-shadow: inset 0 0 0 2px var(--navy)
        }

        .score-cell.winner {
            background: #fff5f3;
            color: var(--red)
        }

        .score-cell::placeholder {
            color: #c9cdd2
        }

        .total-section {
            border-top: 3px solid var(--navy);
            background: #fff
        }

        .total-label {
            padding: 8px 12px 4px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
            color: var(--muted);
            text-transform: uppercase
        }

        .total-row {
            background: #fafafa
        }

        .total-spacer {
            display: grid;
            place-items: center;
            font-size: 10px;
            color: var(--muted);
            font-weight: 800
        }

        .total-cell {
            padding: 13px 4px 15px;
            border: 0;
            border-left: 1px solid var(--line);
            background: #fafafa;
            color: var(--navy);
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap
        }

        .total-cell.leader-circle {
            position: relative;
            color: var(--navy);
            background: inherit;
        }

        .total-cell.leader-circle::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 52px;
            height: 33.6px;
            transform: translate(-50%, -50%) rotate(-5deg);
            border: 2.5px solid var(--red);
            border-radius: 48% 52% 46% 54% / 55% 45% 53% 47%;
            pointer-events: none;
        }

        .total-cell.winner {
            color: var(--red);
            background: #fff5f3
        }

        .score-bottom-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px
        }

        .score-bottom-actions button {
            min-height: 44px;
            border-radius: 11px;
            font-family: Inter, system-ui, sans-serif;
            font-size: 14px;
            font-weight: 800;
            font-style: normal;
            text-transform: uppercase
        }

        .add-player-bottom {
            border: 1px solid var(--navy);
            background: #fff;
            color: var(--navy)
        }

        .end-game-bottom {
            border: 1px solid var(--red);
            background: #fff;
            color: var(--red)
        }

        .message {
            min-height: 28px;
            padding: 10px 4px;
            color: var(--muted);
            font-size: 12px;
            text-align: center
        }

        /* STATS - retained from baseline */

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0;
            overflow: hidden;
            margin-bottom: 18px
        }

        .tab {
            width: 100%;
            min-width: 0;
            padding: 12px 4px;
            border: 0;
            border-right: 1px solid var(--line);
            background: #fff;
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap
        }

        .tab:last-child {
            border-right: 0
        }

        .tab.active {
            background: var(--navy);
            color: #fff
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .metric {
            padding: 20px 10px;
            text-align: center
        }

        .metric label {
            display: block;
            font-size: 10px;
            font-weight: 800
        }

        .metric strong {
            display: block;
            margin: 8px 0 2px;
            font-size: 27px
        }

        .metric strong.red {
            color: var(--red)
        }

        .metric small {
            color: var(--muted)
        }

        .player-summary {
            margin-top: 16px;
            padding: 18px;
            overflow: auto
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 520px;
            font-size: 12px
        }

        .summary-table th,
        .summary-table td {
            padding: 11px 7px;
            border-bottom: 1px solid var(--line);
            text-align: right
        }

        .summary-table th:first-child,
        .summary-table td:first-child {
            text-align: left
        }

        .summary-table th {
            font-size: 9px;
            text-transform: uppercase
        }

        .summary-table tr:first-of-type td:first-child {
            color: var(--red);
            font-weight: 800
        }

        .stats-name-button,
        .stats-delete-button {
            border: 0;
            background: transparent;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .stats-name-button {
            padding: 4px 0;
            color: var(--red);
            text-align: left;
        }

        .stats-delete-button {
            padding: 6px 8px;
            color: var(--red);
        }

        .stats-detail-summary {
            display: grid;
            gap: 5px;
            margin: 10px 0 14px;
            font-size: 12px;
        }

        .record {
            margin-top: 16px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px
        }

        .record strong {
            color: var(--red);
            font-size: 18px
        }

        /* CLASSIC SCORECARD — FINAL */

        body[data-theme="classic"] {
            --bg: #f3e3bd;
            --card: #f7ecd3;
            --navy: #0d2945;
            --red: #a8201a;
            --gold: #b58a3a;
            --muted: #75694f;
            --line: #c9a768;
            --soft: #ead9b3;

            background-color: #f3e3bd;
            background-image: url("classic-bg.png");
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* SCORECARD OUTER BORDER */
        body[data-theme="classic"] .scorecard-wrapper {
            background: #f7ecd3;
            border: 1px solid #b58a3a;
            box-shadow: 0 8px 20px rgba(66, 45, 18, .18);
        }

        /* PLAYER HEADER */
        body[data-theme="classic"] .player-grid {
            background: #0d2945;
            color: #f7ecd3;
            border-bottom: 1px solid #b58a3a;
        }

        body[data-theme="classic"] .player-header {
            background: #0d2945;
            color: #f7ecd3;
            border-left: 1px solid #b58a3a;
        }

        body[data-theme="classic"] .round-head {
            background: #0d2945;
            color: #f7ecd3;
        }

        /* HAND ROWS */
        body[data-theme="classic"] .round-number {
            background: #0d2945;
            color: #f7ecd3;
        }

        body[data-theme="classic"] .score-cell-wrap,
        body[data-theme="classic"] .score-cell {
            background: #f7ecd3;
            color: #0d2945;
        }

        body[data-theme="classic"] .hand-row {
            border-bottom: 1px solid #c9a768;
        }

        body[data-theme="classic"] .score-cell {
            border-left: 1px solid #c9a768;
        }

        body[data-theme="classic"] .score-cell::placeholder {
            color: rgba(13, 41, 69, .42);
        }

        /* TOTAL ROW */
        body[data-theme="classic"] .total-section {
            background: #f7ecd3;
            border-top: 2px solid #b58a3a;
        }

        body[data-theme="classic"] .total-row,
        body[data-theme="classic"] .total-cell {
            background: #f7ecd3;
            color: #0d2945;
        }

        body[data-theme="classic"] .total-spacer {
            background: #0d2945;
            color: #f7ecd3;
        }

        body[data-theme="classic"] .total-cell {
            border-left: 1px solid #c9a768;
        }

        /* SCORE ENTRY */
        body[data-theme="classic"] .score-cell:focus {
            background: #fff8e8;
            color: #0d2945;
            box-shadow: inset 0 0 0 2px #b58a3a;
        }

        /* ADD WAGER */
        body[data-theme="classic"] .wager-display {
            background: #0d2945;
            color: #f7ecd3;
            border: 1px solid #b58a3a;
        }

        body[data-theme="classic"] .game-timer {
            color: #0d2945;
        }

        /* BOTTOM BUTTONS */
        body[data-theme="classic"] .add-player-bottom {
            background: #0d2945;
            color: #f7ecd3;
            border: 1px solid #b58a3a;
        }

        body[data-theme="classic"] .end-game-bottom {
            background: #8f1818;
            color: #fff4dc;
            border: 1px solid #b58a3a;
        }

        /* BOTTOM NAV */
        body[data-theme="classic"] .bottom-nav {
            background: #0d2945;
            border-top: 1px solid #b58a3a;
        }

        body[data-theme="classic"] .nav-btn {
            color: #d5ad5c;
            border-right-color: rgba(181, 138, 58, .55);
        }

        body[data-theme="classic"] .nav-btn.active {
            color: #f0c866;
        }

        body[data-theme="poker"] {
            --bg: #0d3b2e;
            --card: #123f34;
            --navy: #f6f1df;
            --red: #f05b50;
            --gold: #d8b45f;
            --muted: #c8d3cc;
            --line: rgba(255, 255, 255, .16);
            --soft: rgba(255, 255, 255, .08);
            --shadow: 0 10px 28px rgba(0, 0, 0, .22);
            background-color: #082b22;
            background-image: url("poker-bg.png");
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--navy)
        }

        body[data-theme="poker"] .card,
        body[data-theme="poker"] .player-grid,
        body[data-theme="poker"] .score-cell,
        body[data-theme="poker"] .total-section,
        body[data-theme="poker"] .total-row,
        body[data-theme="poker"] .total-cell,
        body[data-theme="poker"] .tabs,
        body[data-theme="poker"] .game-menu,
        body[data-theme="poker"] .modal-card {
            background: var(--card);
            color: var(--navy)
        }

        body[data-theme="poker"] .score-cell::placeholder {
            color: rgba(255, 255, 255, .35)
        }

        body[data-theme="poker"] .bottom-nav {
            background: rgba(8, 43, 34, .96)
        }

        body[data-theme="poker"] .nav-btn {
            color: #d3ded8
        }

        body[data-theme="poker"] .nav-btn.active {
            color: #fff
        }

        body[data-theme="poker"] .tab.active {
            background: #f3ead0;
            color: #0b3328
        }

        body[data-theme="poker"] .player-header.winner,
        body[data-theme="poker"] .score-cell.winner,
        body[data-theme="poker"] .total-cell.winner {
            background: rgba(240, 91, 80, .14)
        }





        .theme-options {
            display: grid;
            gap: 8px
        }

        .theme-choice {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            text-align: left;
            font-weight: 700
        }

        .theme-choice.active {
            box-shadow: inset 0 0 0 2px var(--gold)
        }

        .stats-game-row+.stats-game-detail-row td {
            padding: 0 !important;
            border-bottom: 1px solid var(--line)
        }

        .inline-game-detail {
            padding: 14px 10px 16px;
            background: var(--soft)
        }

        .inline-game-meta {
            display: flex;
            justify-content: space-between;

<body>
    <main class="app">
        <header class="topbar">
            <div class="brand" aria-label="Gin 500 Gin Rummy">
                <div class="brand-suits">♠ <span class="red">♥ ♦</span> ♣</div>
                <div class="brand-name">Gin <span class="red">500</span></div>
                <div class="brand-sub">GIN RUMMY</div>
            </div>

            <div id="gameMenu" class="game-menu hidden">
                <button data-action="pause">Save & Pause Game</button>
                <div class="menu-divider"></div>
                <button data-action="players">Add Player</button>
                <button data-action="remove-player">Remove Player</button>
                <div class="menu-divider"></div>

                <button data-action="delete" class="danger">Delete Current Game</button>
            </div>
        </header>

        <section id="scorePage" class="page active">
            <div class="page-heading">
                <span id="gameStatus" class="eyebrow">scorecard</span>
                <div class="heading-actions">
                    <button id="gameTimer" class="game-timer" type="button"
                        aria-label="Restart or resume game timer">0:00</button>
                    <button id="wagerDisplay" class="wager-display" type="button">+ ADD WAGER</button>
                </div>
            </div>

                    <div id="scorecard"></div>
                </div>
            </section>

                <button id="finishButton" class="end-game-bottom" type="button">END GAME</button>
            </div>

        </section>

            <div class="page-heading"><span class="eyebrow">statistics</span></div>
            <div class="card tabs"><button class="tab active" data-stats-tab="overview">OVERVIEW</button><button
                    class="tab" data-stats-tab="player">BY PLAYER</button><button class="tab" data-stats-tab="game">BY
                    GAME</button></div>
            <div id="statsOverview"></div>
        </section>

    <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-btn active" data-page="score">SCORECARD</button>

    <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
        <div id="modalCard" class="modal-card" role="dialog" aria-modal="true"></div>
    </div>

    <script>
        const APP_CONFIG = { minPlayers: 2, maxPlayers: 8, defaultWinningScore: 500, initialVisibleHands: 5 };
        const DEFAULT_SAVED_PLAYERS = [];
        function createId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) }
        function createEmptyHand() { return { id: createId(), scores: {} } }
        function createNewGame() {
            const now = new Date().toISOString();
            const players = [
                { id: createId(), name: "Player 1" },
                { id: createId(), name: "Player 2" }
            ];

            return {
                id: createId(),
                status: "active",
                createdAt: now,
                updatedAt: now,
                lastSavedAt: null,
                finishedAt: null,
                winningScore: APP_CONFIG.defaultWinningScore,
                players,
                hands: Array.from({ length: APP_CONFIG.initialVisibleHands }, createEmptyHand),
                winnerId: null,
                currentLeaderId: null,
                dealerId: players[0].id,
                timer: {
                    elapsedMs: 0,
                    startedAt: null,
                    running: false
                },
                wager: {
                    amount: null,
                    type: "game"
                }
            };
        }
        /* DATA ACCESS BOUNDARY
           All game persistence goes through this repository.
           To make the app multi-user later, replace this localStorage adapter
           with Firebase/Supabase calls; the UI and game logic do not need to change. */
        const gameRepository = {
            async save(g) { const now = new Date().toISOString(), x = { ...g, updatedAt: now, lastSavedAt: now }; localStorage.setItem("ginRummyCurrentGame", JSON.stringify(x)); return x },
            async loadCurrentGame() { try { return JSON.parse(localStorage.getItem("ginRummyCurrentGame")) } catch { return null } },
            async loadFinishedGames() { try { return JSON.parse(localStorage.getItem("ginRummyFinishedGames") || "[]") } catch { return [] } },
            async archive(g) { const a = await this.loadFinishedGames(); a.push(g); localStorage.setItem("ginRummyFinishedGames", JSON.stringify(a)) },
            async deleteFinishedGame(gameId) { const games = await this.loadFinishedGames(); localStorage.setItem("ginRummyFinishedGames", JSON.stringify(games.filter(g => g.id !== gameId))) },
            async deleteCurrentGame() { localStorage.removeItem("ginRummyCurrentGame") }
        };
        /* Saved-player persistence uses the same replaceable repository pattern. */
        const playerRepository = {
            load() { try { const saved = JSON.parse(localStorage.getItem("ginRummySavedPlayers") || "null"); return Array.isArray(saved) ? saved : DEFAULT_SAVED_PLAYERS.slice() } catch { return DEFAULT_SAVED_PLAYERS.slice() } },
            save(players) { localStorage.setItem("ginRummySavedPlayers", JSON.stringify(players)) }
        };
        const hiddenStatsPlayerRepository = {
            load() { try { const hidden = JSON.parse(localStorage.getItem("ginRummyHiddenStatsPlayers") || "[]"); return Array.isArray(hidden) ? hidden : [] } catch { return [] } },
            hide(name) { const hidden = this.load(); const key = String(name).trim().toLowerCase(); if (!hidden.includes(key)) hidden.push(key); localStorage.setItem("ginRummyHiddenStatsPlayers", JSON.stringify(hidden)) }
        };
        const themeRepository = {
            load() { return localStorage.getItem("ginRummyTheme") || "classic" },
            save(theme) { localStorage.setItem("ginRummyTheme", theme) }
        };

        function applyTheme(theme) {
            document.body.dataset.theme = theme;
            themeRepository.save(theme)
        }

        function getLeaderIcon() {
            const theme = themeRepository.load();
            if (theme === "poker") return "🃏";
            if (theme === "tropical") return "🃏";
            return "🃏"
        }

        function openThemePicker() {
            const current = themeRepository.load();

        function getWagerSettlement() {
            if (!game.wager || Number(game.wager.amount) <= 0) {
                return null;
            }

            const amount = Number(game.wager.amount);
            const balances = Object.fromEntries(
                game.players.map(player => [player.id, 0])
            );

            if (game.wager.type === "game") {
                const winner = determineWinner() || determineLeader();
                if (!winner) return null;

                for (const player of game.players) {
                    if (player.id === winner.id) continue;

                    balances[winner.id] += amount;
                    balances[player.id] -= amount;
                }
            } else {
                for (const hand of completedHands()) {
                    const result = getHandWagerWinner(hand);
                    if (!result) continue;

                    for (const player of game.players) {
                        if (player.id === result.playerId) continue;

                        balances[result.playerId] += amount;
                        balances[player.id] -= amount;
                    }
                }
            }

            const creditors = game.players
                .map(player => ({
                    player,
                    amount: balances[player.id]
                }))
                .filter(item => item.amount > 0)
                .sort((a, b) => b.amount - a.amount);

            const debtors = game.players
                .map(player => ({
                    player,
                    amount: -balances[player.id]
                }))
                .filter(item => item.amount > 0)
                .sort((a, b) => b.amount - a.amount);

            const payments = [];
            let creditorIndex = 0;
            let debtorIndex = 0;

            while (
                creditorIndex < creditors.length &&
                debtorIndex < debtors.length
            ) {
                const creditor = creditors[creditorIndex];
                const debtor = debtors[debtorIndex];
                const payment = Math.min(creditor.amount, debtor.amount);

                if (payment > 0) {
                    payments.push({
                        from: debtor.player,
                        to: creditor.player,
                        amount: payment
                    });
                }

                creditor.amount -= payment;
                debtor.amount -= payment;

                if (creditor.amount <= 0) creditorIndex++;
                if (debtor.amount <= 0) debtorIndex++;
            }

            return {
                balances,
                payments
            };
        }

                `).join("")
                        : `
                    <div class="settlement-row">
                        <span>Everyone is even</span>
                        <strong>$0</strong>
                    </div>
                `;

                    moneyHtml = `
                <div class="winner-money">
                    <div class="winner-money-label">${escapeHtml(winner.name)}'s proceeds</div>
                    <div class="winner-money-total">+$${winnerProceeds}</div>
                </div>

                <div class="settlement-title">settle up</div>
                ${paymentRows}
            `;
                }
            }

            openModal(`
        <div class="winner-popup">
            <div class="winner-title">${escapeHtml(winner.name)} WINS!</div>
            <div class="winner-score">Final score: ${getPlayerTotal(winner.id)}</div>

            ${moneyHtml}

            <button id="winnerDone" class="winner-done">DONE</button>
        </div>
    `);

            $("winnerDone").onclick = closeModal;
        }

        function finishGame() {
            if (completedHands().length === 0) return showMessage("Enter at least one complete hand first.");
            stopGameTimer();
            const leader = determineLeader();
            openModal(`<div class="modal-head"><h3>end game?</h3><button class="close-btn" data-close-modal>×</button></div><div class="muted" style="line-height:1.5;margin-bottom:14px">Choose whether to save this game to game history or delete it.</div><button class="manual-name" id="saveEndedGame">save game</button><button class="manual-name" id="deleteEndedGame" style="color:var(--red);border-color:var(--red)">delete game</button>`);
            modalCard.querySelector("[data-close-modal]").onclick = closeModal;
            $("saveEndedGame").onclick = () => saveEndedGame(leader?.id || null);
            $("deleteEndedGame").onclick = deleteEndedGame
        }

        async function saveEndedGame(winnerId) {
            closeModal(); stopGameTimer(); game.hands = completedHands(); game.status = "finished"; game.finishedAt = new Date().toISOString(); game.updatedAt = game.finishedAt; game.winnerId = winnerId;
            await gameRepository.archive(game); await gameRepository.deleteCurrentGame();
            game = createNewGame(); ensureMinimumHands(); await gameRepository.save(game); renderGame(); await renderStats(); showPage("score"); showMessage("Game saved.")
        }

        async function deleteEndedGame() {
            closeModal(); await gameRepository.deleteCurrentGame(); game = createNewGame(); ensureMinimumHands(); await gameRepository.save(game); renderGame(); showPage("score"); showMessage("Game deleted.")
        }

        async function deleteGame() { if (!confirm("Delete this game? This cannot be undone.")) return; await gameRepository.deleteCurrentGame(); game = createNewGame(); await gameRepository.save(game); renderGame(); showPage("score") }
        function openSettings() { const value = prompt("Winning score:", game.winningScore); if (!value) return; const score = Number(value); if (!Number.isFinite(score) || score <= 0) return showMessage("Enter a valid winning score."); game.winningScore = score; showMessage(`Winning score set to ${score}.`) }
        function toggleMenu() { gameMenu.classList.toggle("hidden") } function closeMenu() { gameMenu.classList.add("hidden") }
        async function handleMenuAction(e) {
            const b = e.target.closest("[data-action]");
            if (!b) return;

            closeMenu();
            const a = b.dataset.action;

            if (a === "pause") await togglePauseGame();
            else if (a === "players") openPlayerListManager();
            else if (a === "remove-player") removePlayer();
            else if (a === "theme") openThemePicker();
            else if (a === "settings") openSettings();
            else if (a === "delete") await deleteGame();
        }
        function showMessage(m) { messageElement.textContent = m; clearTimeout(showMessage.timeout); showMessage.timeout = setTimeout(() => messageElement.textContent = "", 2500) }

        function showPage(page) { currentPage = page; document.querySelectorAll(".page").forEach(x => x.classList.remove("active")); $(`${page}Page`).classList.add("active"); document.querySelectorAll(".nav-btn").forEach(x => x.classList.toggle("active", x.dataset.page === page)); if (page === "score") renderGame(); if (page === "stats") renderStats(); window.scrollTo(0, 0) }
        function getArchivedGameSettlement(g) {
            const balances = Object.fromEntries(g.players.map(p => [p.id, 0]));
            const amount = Number(g.wager?.amount) || 0;
            if (amount <= 0) return { balances, winnerProceeds: 0 };

            if (g.wager.type === "hand") {
                for (const hand of g.hands) {
                    if (!g.players.every(p => hand.scores[p.id] !== undefined && hand.scores[p.id] !== null && hand.scores[p.id] !== "")) continue;
                    const high = Math.max(...g.players.map(p => Number(hand.scores[p.id])));
                    const winners = g.players.filter(p => Number(hand.scores[p.id]) === high);
                    if (winners.length !== 1) continue;
                    for (const player of g.players) {
                        if (player.id === winners[0].id) continue;
                        balances[winners[0].id] += amount;
                        balances[player.id] -= amount;
                    }
                }
            } else {
                const winner = g.players.find(p => p.id === g.winnerId);
                if (winner) {
                    for (const player of g.players) {
                        if (player.id === winner.id) continue;
                        balances[winner.id] += amount;
                        balances[player.id] -= amount;
                    }
                }
            }

            return {
                balances,
                winnerProceeds: balances[g.winnerId] || 0
            };
        }

        function formatMoney(value) {
            const amount = Number(value) || 0;
            return `${amount > 0 ? "+" : amount < 0 ? "−" : ""}$${Math.abs(amount)}`;
        }

        function formatArchivedWager(g) {
            const amount = Number(g.wager?.amount) || 0;
            if (amount <= 0) return "No wager";
            return `$${amount} ${g.wager.type === "hand" ? "per hand" : "per game"}`;
        }

        async function buildStats() {
            const games = await gameRepository.loadFinishedGames();
            const hidden = new Set(hiddenStatsPlayerRepository.load());
            const map = new Map();
            let high = { score: null, name: "" }, low = { score: null, name: "" };

            for (const g of games) {
                const totals = {};
                const settlement = getArchivedGameSettlement(g);
                for (const p of g.players) {
                    totals[p.id] = g.hands.reduce((t, h) => t + Number(h.scores[p.id] || 0), 0);
                    const key = p.name.trim().toLowerCase();
                    if (!map.has(key)) map.set(key, { name: p.name, games: 0, wins: 0, points: 0, netWinnings: 0 });
                    const stats = map.get(key);
                    stats.games++;
                    stats.points += totals[p.id];
                    stats.netWinnings += settlement.balances[p.id] || 0;
                    if (p.id === g.winnerId) stats.wins++;
                    for (const h of g.hands) {
                        const value = h.scores[p.id];
                        if (value !== undefined) {
                            if (high.score === null || Number(value) > high.score) high = { score: Number(value), name: p.name };
                            if (low.score === null || Number(value) < low.score) low = { score: Number(value), name: p.name };
                        }
                    }
                }
            }

            return {
                games,
                players: [...map.entries()].filter(([key]) => !hidden.has(key)).map(([, value]) => value).sort((a, b) => b.wins - a.wins),
                high,
                low
            };
        }
        let currentStatsTab = "overview";
        async function renderStats() {
            const s = await buildStats();
            document.querySelectorAll("[data-stats-tab]").forEach(b => b.classList.toggle("active", b.dataset.statsTab === currentStatsTab));
            if (currentStatsTab === "player") return renderStatsByPlayer(s);
            if (currentStatsTab === "game") return renderStatsByGame(s);
            const top = s.players[0];
            $("statsOverview").innerHTML = `<div class="stats-grid"><div class="card metric"><label>TOTAL GAMES</label><strong>${s.games.length}</strong><small>played</small></div><div class="card metric"><label>TOP PLAYER</label><strong class="red">${top?.name || "—"}</strong><small>${top ? `${top.wins} wins` : "no games yet"}</small></div><div class="card metric"><label>LOWEST HAND</label><strong>${s.low.score ?? "—"}</strong><small>${s.low.name ? `by ${escapeHtml(s.low.name)}` : "—"}</small></div><div class="card metric"><label>HIGHEST HAND</label><strong class="red">${s.high.score ?? "—"}</strong><small>${s.high.name ? `by ${escapeHtml(s.high.name)}` : "—"}</small></div></div><div class="card player-summary"><div class="section-title" style="margin-bottom:8px">player summary</div><table class="summary-table"><thead><tr><th>player</th><th>games</th><th>wins</th><th>win %</th><th>net winnings</th></tr></thead><tbody>${s.players.length ? s.players.map(p => `<tr><td><button class="stats-name-button" data-stats-player="${escapeHtml(p.name)}">${escapeHtml(p.name)}</button></td><td>${p.games}</td><td>${p.wins}</td><td>${Math.round(p.wins / p.games * 100)}%</td><td>${formatMoney(p.netWinnings)}</td></tr>`).join("") : '<tr><td colspan="5">No finished games yet.</td></tr>'}</tbody></table></div>`;
            $("statsOverview").querySelectorAll("[data-stats-player]").forEach(button => button.onclick = () => showPlayerWinnings(button.dataset.statsPlayer, s));
        }
        function renderStatsByPlayer(s) {
            $("statsOverview").innerHTML = `<div class="card player-summary"><div class="section-title" style="margin-bottom:8px">by player</div><table class="summary-table"><thead><tr><th>player</th><th>games</th><th>wins</th><th>win %</th><th>net winnings</th><th></th></tr></thead><tbody>${s.players.length ? s.players.map(p => `<tr><td><button class="stats-name-button" data-stats-player="${escapeHtml(p.name)}">${escapeHtml(p.name)}</button></td><td>${p.games}</td><td>${p.wins}</td><td>${Math.round(p.wins / p.games * 100)}%</td><td>${formatMoney(p.netWinnings)}</td><td><button class="stats-delete-button" data-hide-stats-player="${escapeHtml(p.name)}" aria-label="Hide ${escapeHtml(p.name)} from stats">✕</button></td></tr>`).join("") : '<tr><td colspan="6">No players to show.</td></tr>'}</tbody></table></div>`;
            $("statsOverview").querySelectorAll("[data-stats-player]").forEach(button => button.onclick = () => showPlayerWinnings(button.dataset.statsPlayer, s));
            $("statsOverview").querySelectorAll("[data-hide-stats-player]").forEach(button => button.onclick = () => hideStatsPlayer(button.dataset.hideStatsPlayer));
        }
        function renderStatsByGame(s) {
            const games = s.games.slice().sort((a, b) => new Date(b.finishedAt || b.updatedAt) - new Date(a.finishedAt || a.updatedAt));
            $("statsOverview").innerHTML = `<div class="card player-summary"><div class="section-title" style="margin-bottom:8px">by game</div><table class="summary-table"><thead><tr><th>date</th><th>winner</th><th>wager</th><th>time</th></tr></thead><tbody>${games.length ? games.map(g => { const w = g.players.find(p => p.id === g.winnerId); return `<tr class="stats-game-row" data-stats-game-id="${g.id}" style="cursor:pointer"><td>${formatDate(g.finishedAt || g.updatedAt)}</td><td>${escapeHtml(w?.name || "—")}</td><td>${formatArchivedWager(g)}</td><td>${formatGameDuration(g.timer?.elapsedMs || 0)}</td></tr>` }).join("") : '<tr><td colspan="4">No finished games yet.</td></tr>'}</tbody></table></div>`;
            $("statsOverview").querySelectorAll("[data-stats-game-id]").forEach(row => row.onclick = () => toggleStatsGameDetail(row, row.dataset.statsGameId, games))
        }

        function showPlayerWinnings(name, stats) {
            const player = stats.players.find(p => p.name === name);
            if (!player) return;
            openModal(`<div class="modal-head"><h3>${escapeHtml(player.name)}</h3><button class="close-btn" data-close-modal>×</button></div><div class="winner-money"><div class="winner-money-label">total net winnings</div><div class="winner-money-total">${formatMoney(player.netWinnings)}</div></div><div class="muted" style="text-align:center;margin-top:12px">${player.wins} wins in ${player.games} games</div>`);
            modalCard.querySelector("[data-close-modal]").onclick = closeModal;
        }

        async function hideStatsPlayer(name) {
            if (!confirm(`Hide ${name} from player statistics? Their old games will remain.`)) return;
            hiddenStatsPlayerRepository.hide(name);
            await renderStats();
        }

        async function deleteFinishedGame(gameId) {
            if (!confirm("Delete this game from history? This cannot be undone.")) return;
            await gameRepository.deleteFinishedGame(gameId);
            await renderStats();
            showMessage("Game deleted from history.");
        }

        function toggleStatsGameDetail(row, gameId, games) {
            const existing = row.nextElementSibling;
            if (existing?.classList.contains("stats-game-detail-row")) { existing.remove(); return }
            document.querySelectorAll(".stats-game-detail-row").forEach(el => el.remove());
            const g = games.find(x => x.id === gameId); if (!g) return;
            const winner = g.players.find(p => p.id === g.winnerId);
            const totals = Object.fromEntries(g.players.map(p => [p.id, g.hands.reduce((t, h) => t + Number(h.scores[p.id] || 0), 0)]));
            const settlement = getArchivedGameSettlement(g);
            const detail = document.createElement("tr");
            detail.className = "stats-game-detail-row";
            detail.innerHTML = `<td colspan="4"><div class="inline-game-detail"><div class="inline-game-meta"><span>${formatDateTime(g.finishedAt || g.updatedAt)}</span><span>${formatGameDuration(g.timer?.elapsedMs || 0)}</span></div><div class="stats-detail-summary"><strong>${escapeHtml(winner?.name || "—")} won</strong><span>Wager: ${formatArchivedWager(g)}</span><span>Winner's proceeds: ${formatMoney(settlement.winnerProceeds)}</span></div><div class="inline-score-wrap"><table class="inline-score-table"><thead><tr><th>#</th>${g.players.map(p => `<th class="${p.id === g.winnerId ? "winner-col" : ""}">${escapeHtml(p.name)}</th>`).join("")}</tr></thead><tbody>${g.hands.map((h, i) => `<tr><td>${i + 1}</td>${g.players.map(p => `<td class="${p.id === g.winnerId ? "winner-col" : ""}">${h.scores[p.id] ?? "—"}</td>`).join("")}</tr>`).join("")}<tr><td>Σ</td>${g.players.map(p => `<td class="${p.id === g.winnerId ? "winner-col" : ""}"><strong>${totals[p.id]}</strong></td>`).join("")}</tr></tbody></table></div><button class="manual-name" data-delete-finished-game="${g.id}" style="color:var(--red);border-color:var(--red);margin-top:14px">delete game</button></div></td>`;
            row.insertAdjacentElement("afterend", detail)
            detail.querySelector("[data-delete-finished-game]").onclick = event => { event.stopPropagation(); deleteFinishedGame(gameId) }
        }

        function formatDate(v) { if (!v) return "—"; return new Date(v).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) }
        function formatDateTime(v) { if (!v) return "—"; return new Date(v).toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) }
        async function renderAll() { renderGame(); await renderStats() }
        async function initializeApp() { applyTheme(themeRepository.load()); const saved = await gameRepository.loadCurrentGame(); game = saved && saved.status !== "finished" ? saved : createNewGame(); normalizeGameTimer(); ensureMinimumHands(); await renderAll(); showPage("score"); runGameTimerDisplay() }

        menuButton.addEventListener("click", e => { e.stopPropagation(); toggleMenu() });
        gameMenu.addEventListener("click", handleMenuAction);
        document.addEventListener("click", e => { if (!gameMenu.contains(e.target) && e.target !== menuButton) closeMenu() });
        modalBackdrop.addEventListener("click", e => { if (e.target === modalBackdrop) closeModal() });
        $("finishButton").onclick = finishGame;
        $("gameTimer").onclick = restartOrResumeGameTimer;
        $("addPlayerButton").onclick = addPlayer;
        document.querySelectorAll("[data-page]").forEach(b => b.addEventListener("click", () => showPage(b.dataset.page)));
        document.querySelectorAll("[data-stats-tab]").forEach(b => b.addEventListener("click", () => { currentStatsTab = b.dataset.statsTab; renderStats() }));
        initializeApp();
    </script>
</body>
