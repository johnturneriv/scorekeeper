<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" />
    <title>Gin 500</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #fbfaf8;
            --card: #fff;
            --navy: #071b35;
            --red: #b5231d;
            --gold: #a88645;
            --muted: #737b86;
            --line: #e3e5e8;
            --soft: #f5f6f7;
            --shadow: 0 8px 28px rgba(7, 27, 53, .07);
            --radius: 18px
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background: var(--bg);
            color: var(--navy)
        }

        html {
            touch-action: pan-y
        }

        body {
            font-family: Inter, system-ui, sans-serif
        }

        button,
        input {
            font: inherit
        }

        button {
            cursor: pointer;
            color: inherit
        }

        .hidden {
            display: none !important
        }

        .app {
            width: min(100%, 760px);
            min-height: 100vh;
            margin: auto;
            padding: max(18px, env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))
        }

        .topbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 92px;
            padding: 0 58px 8px
        }

        .brand {
            text-align: center;
            line-height: .8
        }

        .brand-suits {
            font-size: 16px;
            letter-spacing: 4px;
            text-align: center;
            margin: 0 0 3px 9px
        }

        .brand-suits .red {
            color: var(--red)
        }

        .brand-name {
            font-family: "Cormorant Garamond", serif;
            font-size: 57px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: -2px
        }

        .brand-name .red {
            color: var(--red)
        }

        .brand-sub {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 4px
        }

        .brand-sub:before,
        .brand-sub:after {
            content: "";
            width: 22px;
            height: 1px;
            background: var(--gold)
        }

        .menu-button {
            position: absolute;
            right: 2px;
            top: 4px;
            width: 50px;
            height: 50px;
            border: 0;
            background: transparent;
            border-radius: 50%;
            font-size: 32px
        }

        .menu-button:hover {
            background: var(--soft)
        }

        .game-menu {
            position: absolute;
            z-index: 50;
            right: 4px;
            top: 55px;
            width: 220px;
            padding: 8px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow)
        }

        .game-menu button {
            display: block;
            width: 100%;
            padding: 11px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            text-align: left;
            font-family: Inter, system-ui, sans-serif;
            font-size: 14px;
            font-weight: 500;
            font-style: normal;
            text-transform: uppercase
        }

        .game-menu button:hover {
            background: var(--soft)
        }

        .game-menu .danger {
            color: var(--red)
        }

        .menu-divider {
            height: 1px;
            background: var(--line);
            margin: 5px
        }

        .page {
            display: none
        }

        .page.active {
            display: block
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow)
        }

        .section-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase
        }

        .muted {
            color: var(--muted)
        }

        /* SCORECARD */
        .page-heading {
            margin: 5px 2px 14px
        }

        .eyebrow {
            font-family: "Cormorant Garamond", serif;
            font-size: 30px;
            line-height: 34px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: -.4px
        }

        .scorecard-wrapper {
            overflow: hidden
        }

        .score-horizontal-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch
        }

        .scorecard-inner {
            min-width: 100%
        }

        .scorecard-inner.wide {
            min-width: calc(40px + (var(--player-count) * 92px))
        }

        .score-scroll-area {
            overflow: visible;
            max-height: none;
            min-height: 0
        }

        .player-grid,
        .hand-row,
        .total-row {
            display: grid;
            grid-template-columns: 40px repeat(var(--player-count), minmax(0, 1fr))
        }

        .player-grid {
            background: #fff;
            border-bottom: 1px solid var(--line)
        }

        .round-head,
        .player-header {
            padding: 14px 5px;
            text-align: center;
            font-size: 11px;
            font-weight: 800
        }

        .player-header {
            border-left: 1px solid var(--line);
            min-width: 0;
            cursor: pointer
        }

        .player-name-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 0
        }

        .player-name-text {
            display: block;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            white-space: nowrap;
            font-size: 14px;
            line-height: 1.1;
            font-weight: 800
        }

        .leader-ace {
            flex: 0 0 auto;
            display: inline-grid;
            place-items: center;
            width: 18px;
            height: 24px;
            border: 1px solid var(--navy);
            border-radius: 3px;
            background: #fff;
            color: var(--navy);
            font-size: 8px;
            font-weight: 800;
            line-height: 1
        }

        .player-header:hover {
            background: var(--soft)
        }

        .player-header.winner {
            color: var(--red);
            background: #fff5f3
        }

        .hand-row {
            border-bottom: 1px solid var(--line)
        }

        .round-number {
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700
        }

        .score-cell {
            min-width: 0;
            height: 53px;
            padding: 0;
            border: 0;
            border-left: 1px solid var(--line);
            background: #fff;
            color: var(--navy);
            text-align: center;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            -moz-appearance: textfield
        }

        .score-cell::-webkit-inner-spin-button,
        .score-cell::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0
        }

        .score-cell:focus {
            position: relative;
            z-index: 2;
            box-shadow: inset 0 0 0 2px var(--navy)
        }

        .score-cell.winner {
            background: #fff5f3;
            color: var(--red)
        }

        .score-cell::placeholder {
            color: #c9cdd2
        }

        .total-section {
            border-top: 3px solid var(--navy);
            background: #fff
        }

        .total-label {
            padding: 8px 12px 4px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .08em;
            color: var(--muted);
            text-transform: uppercase
        }

        .total-row {
            background: #fafafa
        }

        .total-spacer {
            display: grid;
            place-items: center;
            font-size: 10px;
            color: var(--muted);
            font-weight: 800
        }

        .total-cell {
            padding: 13px 4px 15px;
            border: 0;
            border-left: 1px solid var(--line);
            background: #fafafa;
            color: var(--navy);
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap
        }

        .total-cell.winner {
            color: var(--red);
            background: #fff5f3
        }

        .score-bottom-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px
        }

        .score-bottom-actions button {
            min-height: 44px;
            border-radius: 11px;
            font-family: Inter, system-ui, sans-serif;
            font-size: 14px;
            font-weight: 800;
            font-style: normal;
            text-transform: uppercase
        }

        .add-player-bottom {
            border: 1px solid var(--navy);
            background: #fff;
            color: var(--navy)
        }

        .end-game-bottom {
            border: 1px solid var(--red);
            background: #fff;
            color: var(--red)
        }

        .message {
            min-height: 28px;
            padding: 10px 4px;
            color: var(--muted);
            font-size: 12px;
            text-align: center
        }

        /* STATS - retained from baseline */

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0;
            overflow: hidden;
            margin-bottom: 18px
        }

        .tab {
            width: 100%;
            min-width: 0;
            padding: 12px 4px;
            border: 0;
            border-right: 1px solid var(--line);
            background: #fff;
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap
        }

        .tab:last-child {
            border-right: 0
        }

        .tab.active {
            background: var(--navy);
            color: #fff
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .metric {
            padding: 20px 10px;
            text-align: center
        }

        .metric label {
            display: block;
            font-size: 10px;
            font-weight: 800
        }

        .metric strong {
            display: block;
            margin: 8px 0 2px;
            font-size: 27px
        }

        .metric strong.red {
            color: var(--red)
        }

        .metric small {
            color: var(--muted)
        }

        .player-summary {
            margin-top: 16px;
            padding: 18px;
            overflow: auto
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 520px;
            font-size: 12px
        }

        .summary-table th,
        .summary-table td {
            padding: 11px 7px;
            border-bottom: 1px solid var(--line);
            text-align: right
        }

        .summary-table th:first-child,
        .summary-table td:first-child {
            text-align: left
        }

        .summary-table th {
            font-size: 9px;
            text-transform: uppercase
        }

        .summary-table tr:first-of-type td:first-child {
            color: var(--red);
            font-weight: 800
        }

        .record {
            margin-top: 16px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px
        }

        .record strong {
            color: var(--red);
            font-size: 18px
        }



        body[data-theme="poker"] {
            --bg: #0d3b2e;
            --card: #123f34;
            --navy: #f6f1df;
            --red: #f05b50;
            --gold: #d8b45f;
            --muted: #c8d3cc;
            --line: rgba(255, 255, 255, .16);
            --soft: rgba(255, 255, 255, .08);
            --shadow: 0 10px 28px rgba(0, 0, 0, .22);
            background:
                radial-gradient(circle at 18% 18%, rgba(255, 255, 255, .05), transparent 23%),
                radial-gradient(circle at 78% 32%, rgba(255, 255, 255, .04), transparent 20%),
                linear-gradient(135deg, #0f4c3a, #082b22);
            color: var(--navy)
        }

        body[data-theme="poker"] .card,
        body[data-theme="poker"] .player-grid,
        body[data-theme="poker"] .score-cell,
        body[data-theme="poker"] .total-section,
        body[data-theme="poker"] .total-row,
        body[data-theme="poker"] .total-cell,
        body[data-theme="poker"] .tabs,
        body[data-theme="poker"] .game-menu,
        body[data-theme="poker"] .modal-card {
            background: var(--card);
            color: var(--navy)
        }

        body[data-theme="poker"] .score-cell::placeholder {
            color: rgba(255, 255, 255, .35)
        }

        body[data-theme="poker"] .bottom-nav {
            background: rgba(8, 43, 34, .96)
        }

        body[data-theme="poker"] .nav-btn {
            color: #d3ded8
        }

        body[data-theme="poker"] .nav-btn.active {
            color: #fff
        }

        body[data-theme="poker"] .tab.active {
            background: #f3ead0;
            color: #0b3328
        }

        body[data-theme="poker"] .player-header.winner,
        body[data-theme="poker"] .score-cell.winner,
        body[data-theme="poker"] .total-cell.winner {
            background: rgba(240, 91, 80, .14)
        }

        body[data-theme="poker"] .leader-ace {
            background: #f8f4e6;
            color: #0b3328;
            border-color: #f8f4e6
        }

        body[data-theme="tropical"] {
            --bg: #fff7ed;
            --card: rgba(255, 255, 255, .92);
            --navy: #0a5060;
            --red: #ef5a67;
            --gold: #f0b84b;
            --muted: #5e7f85;
            --line: rgba(10, 80, 96, .16);
            --soft: #eefaf8;
            --shadow: 0 10px 30px rgba(13, 100, 110, .10);
            background:
                radial-gradient(circle at 15% 10%, rgba(255, 196, 103, .28), transparent 24%),
                radial-gradient(circle at 86% 18%, rgba(80, 199, 191, .22), transparent 24%),
                linear-gradient(180deg, #fff8ef, #f3fffb);
            color: var(--navy)
        }

        body[data-theme="tropical"] .brand-name .red,
        body[data-theme="tropical"] .metric strong.red,
        body[data-theme="tropical"] .game-menu .danger,
        body[data-theme="tropical"] .end-game-bottom {
            color: #ef5a67
        }

        body[data-theme="tropical"] .bottom-nav {
            background: rgba(255, 255, 255, .94)
        }

        body[data-theme="tropical"] .nav-btn.active {
            color: #0aa3a8
        }

        body[data-theme="tropical"] .tab.active {
            background: #0a7d83;
            color: #fff
        }

        .theme-options {
            display: grid;
            gap: 8px
        }

        .theme-choice {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            text-align: left;
            font-weight: 700
        }

        .theme-choice.active {
            box-shadow: inset 0 0 0 2px var(--gold)
        }

        .stats-game-row+.stats-game-detail-row td {
            padding: 0 !important;
            border-bottom: 1px solid var(--line)
        }

        .inline-game-detail {
            padding: 14px 10px 16px;
            background: var(--soft)
        }

        .inline-game-meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 11px;
            color: var(--muted)
        }

        .inline-score-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card)
        }

        .inline-score-table {
            width: 100%;
            min-width: 420px;
            border-collapse: collapse;
            font-size: 12px
        }

        .inline-score-table th,
        .inline-score-table td {
            padding: 8px;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            text-align: center
        }

        .inline-score-table th:last-child,
        .inline-score-table td:last-child {
            border-right: 0
        }

        .inline-score-table tr:last-child td {
            border-bottom: 0
        }

        .inline-score-table th {
            background: var(--soft)
        }

        .inline-score-table .winner-col {
            color: var(--red);
            font-weight: 800
        }


        /* THEME POLISH */
        body[data-theme="poker"] .player-grid,
        body[data-theme="poker"] .score-cell,
        body[data-theme="poker"] .total-section,
        body[data-theme="poker"] .total-row,
        body[data-theme="poker"] .total-cell,
        body[data-theme="poker"] .tab,
        body[data-theme="poker"] .manual-name,
        body[data-theme="poker"] .theme-choice,
        body[data-theme="poker"] .player-list-add input {
            background: #0f4938;
            color: #fff8e7
        }

        body[data-theme="poker"] .add-player-bottom,
        body[data-theme="poker"] .end-game-bottom {
            background: #0f4938;
            color: #fff8e7;
            border-color: #d8b45f
        }

        body[data-theme="poker"] .end-game-bottom {
            color: #ff8b82;
            border-color: #ff8b82
        }

        body[data-theme="poker"] .game-menu button,
        body[data-theme="poker"] .saved-player-name,
        body[data-theme="poker"] .close-btn,
        body[data-theme="poker"] .modal-head,
        body[data-theme="poker"] .summary-table,
        body[data-theme="poker"] .inline-score-table {
            color: #fff8e7
        }

        body[data-theme="poker"] .game-menu button:hover,
        body[data-theme="poker"] .player-header:hover,
        body[data-theme="poker"] .theme-choice.active {
            background: #1b604b
        }

        body[data-theme="poker"] .tab:not(.active) {
            background: #0f4938;
            color: #fff8e7
        }

        body[data-theme="poker"] .player-header.winner,
        body[data-theme="poker"] .score-cell.winner,
        body[data-theme="poker"] .total-cell.winner {
            background: #7d2828;
            color: #fff
        }

        body[data-theme="poker"] .score-cell:focus {
            background: #fff8e7;
            color: #092d23;
            box-shadow: inset 0 0 0 2px #d8b45f
        }

        body[data-theme="poker"] .summary-table tr:first-of-type td:first-child,
        body[data-theme="poker"] .inline-score-table .winner-col {
            color: #ff9a91
        }

        body[data-theme="poker"] .inline-game-detail,
        body[data-theme="poker"] .inline-score-table th {
            background: #0b362a;
            color: #fff8e7
        }

        }

        body[data-theme="tropical"] .total-section,

        body[data-theme="tropical"] .tabs,

        }

        body[data-theme="tropical"] .score-cell:focus {

        }

        }

        body[data-theme="tropical"] .inline-game-detail,
        body[data-theme="tropical"] .inline-score-table th {

            color: #073b4c
        }

        body[data-theme="tropical"] .summary-table tr:first-of-type td:first-child,
        body[data-theme="tropical"] .inline-score-table .winner-col {
            color: #c92f50
        }

        body[data-theme="tropical"] .theme-choice.active {
            background: #ffcf4a;
            color: #073b4c
        }

        /* Theme-safe winner icon */
        .leader-icon {
            flex: 0 0 auto;
            display: inline-grid;
            place-items: center;
            width: 24px;
            height: 24px;
            padding: 0;
            border: 0;
            background: transparent;
            font-size: 17px;
            font-weight: 800;
            line-height: 1
        }

        body[data-theme="poker"] .leader-icon {
            width: 18px;
            height: 26px;
            padding: 0;
            border: 1px solid #082b22;
            border-radius: 3px;
            background: #fff8e7;

        @media(max-width:520px) {

<body>
    <main class="app">
        <header class="topbar">
            <div class="brand" aria-label="Gin 500 Gin Rummy">
                <div class="brand-suits">♠ <span class="red">♥ ♦</span> ♣</div>
                <div class="brand-name">Gin <span class="red">500</span></div>
                <div class="brand-sub">GIN RUMMY</div>
            </div>
            <button id="menuButton" class="menu-button" type="button" aria-label="Game menu">☰</button>
            <div id="gameMenu" class="game-menu hidden">
                <button data-action="save">Save Progress</button>
                <button data-action="pause">Pause Game</button>
                <div class="menu-divider"></div>
                <button data-action="players">Player List</button>
                <button data-action="remove-player">Remove Player from Game</button>
                <div class="menu-divider"></div>
                <button data-action="theme">Change Theme</button>
                <div class="menu-divider"></div>
                <button data-action="settings">Winning Score</button>
                <button data-action="delete" class="danger">Delete Current Game</button>
            </div>
        </header>

        <section id="scorePage" class="page active">
            <div class="page-heading">
                <span id="gameStatus" class="eyebrow">scorecard</span>
            </div>
            <section class="card scorecard-wrapper">
                <div class="score-horizontal-scroll">
                    <div id="scorecard"></div>
                </div>
            </section>
            <div class="score-bottom-actions">
                <button id="addPlayerButton" class="add-player-bottom" type="button">ADD PLAYER</button>
                <button id="finishButton" class="end-game-bottom" type="button">END GAME</button>
            </div>
            <div id="message" class="message" aria-live="polite"></div>
        </section>
        <section id="statsPage" class="page">
            <div class="page-heading"><span class="eyebrow">statistics</span></div>
            <div class="card tabs"><button class="tab active" data-stats-tab="overview">OVERVIEW</button><button
                    class="tab" data-stats-tab="player">BY PLAYER</button><button class="tab" data-stats-tab="game">BY
                    GAME</button></div>
            <div id="statsOverview"></div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-btn active" data-page="score">SCORECARD</button>
        <button class="nav-btn" data-page="stats">STATS</button>
    </nav>

    <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
        <div id="modalCard" class="modal-card" role="dialog" aria-modal="true"></div>
    </div>

    <script>
        const APP_CONFIG = { minPlayers: 2, maxPlayers: 8, defaultWinningScore: 500, initialVisibleHands: 5 };
        const DEFAULT_SAVED_PLAYERS = [];
        function createId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2) }
        function createEmptyHand() { return { id: createId(), scores: {} } }
        function createNewGame() { const now = new Date().toISOString(); return { id: createId(), status: "active", createdAt: now, updatedAt: now, lastSavedAt: null, finishedAt: null, winningScore: APP_CONFIG.defaultWinningScore, players: [{ id: createId(), name: "Player 1" }, { id: createId(), name: "Player 2" }], hands: Array.from({ length: APP_CONFIG.initialVisibleHands }, createEmptyHand), winnerId: null, currentLeaderId: null } }
        /* DATA ACCESS BOUNDARY
           All game persistence goes through this repository.
           To make the app multi-user later, replace this localStorage adapter
           with Firebase/Supabase calls; the UI and game logic do not need to change. */
        const gameRepository = {
            async save(g) { const now = new Date().toISOString(), x = { ...g, updatedAt: now, lastSavedAt: now }; localStorage.setItem("ginRummyCurrentGame", JSON.stringify(x)); return x },
            async loadCurrentGame() { try { return JSON.parse(localStorage.getItem("ginRummyCurrentGame")) } catch { return null } },
            async loadFinishedGames() { try { return JSON.parse(localStorage.getItem("ginRummyFinishedGames") || "[]") } catch { return [] } },
            async archive(g) { const a = await this.loadFinishedGames(); a.push(g); localStorage.setItem("ginRummyFinishedGames", JSON.stringify(a)) },
            async deleteCurrentGame() { localStorage.removeItem("ginRummyCurrentGame") }
        };
        /* Saved-player persistence uses the same replaceable repository pattern. */
        const playerRepository = {
            load() { try { const saved = JSON.parse(localStorage.getItem("ginRummySavedPlayers") || "null"); return Array.isArray(saved) ? saved : DEFAULT_SAVED_PLAYERS.slice() } catch { return DEFAULT_SAVED_PLAYERS.slice() } },
            save(players) { localStorage.setItem("ginRummySavedPlayers", JSON.stringify(players)) }
        };
        const themeRepository = {
            load() { return localStorage.getItem("ginRummyTheme") || "classic" },
            save(theme) { localStorage.setItem("ginRummyTheme", theme) }
        };

        function applyTheme(theme) {
            document.body.dataset.theme = theme;
            themeRepository.save(theme)
        }

        function getLeaderIcon() {
            const theme = themeRepository.load();
            if (theme === "poker") return "A♠";
            if (theme === "tropical") return "😎";
            return "💯"
        }

        function openThemePicker() {
            const current = themeRepository.load();
            openModal(`<div class="modal-head"><h3>change theme</h3><button class="close-btn" data-close-modal>×</button></div><div class="theme-options"><button class="theme-choice ${current === "classic" ? "active" : ""}" data-theme-choice="classic">Classic</button><button class="theme-choice ${current === "poker" ? "active" : ""}" data-theme-choice="poker">Poker Night</button><button class="theme-choice ${current === "tropical" ? "active" : ""}" data-theme-choice="tropical">Tropical</button></div>`);
            modalCard.querySelector("[data-close-modal]").onclick = closeModal;
            modalCard.querySelectorAll("[data-theme-choice]").forEach(button => button.onclick = () => {
                applyTheme(button.dataset.themeChoice);
                closeModal();
                renderGame();
                renderStats()
            })
        }

        let game = null, newRowTimer = null, currentPage = "score";
        const $ = id => document.getElementById(id);
        const scorecardElement = $("scorecard"), menuButton = $("menuButton"), gameMenu = $("gameMenu"), gameStatusElement = $("gameStatus"), messageElement = $("message"), modalBackdrop = $("modalBackdrop"), modalCard = $("modalCard");

        function getPlayerTotal(playerId) { return game.hands.reduce((t, h) => { const v = h.scores[playerId]; return v === undefined || v === null || v === "" ? t : t + Number(v) }, 0) }
        function getTotals() { return Object.fromEntries(game.players.map(p => [p.id, getPlayerTotal(p.id)])) }
        function isHandComplete(hand) { return game.players.every(p => hand.scores[p.id] !== undefined && hand.scores[p.id] !== null && hand.scores[p.id] !== "") }
        function completedHands() { return game.hands.filter(isHandComplete) }
        function determineLeader() { const totals = getTotals(); let leader = null, high = -Infinity; for (const p of game.players) { if (totals[p.id] > high) { high = totals[p.id]; leader = p } } game.currentLeaderId = leader?.id || null; return leader }
        function determineWinner() { const activeHands = game.hands.filter(h => Object.keys(h.scores).some(id => h.scores[id] !== undefined && h.scores[id] !== null && h.scores[id] !== "")); if (!activeHands.length || !isHandComplete(activeHands[activeHands.length - 1])) return null; const leader = determineLeader(); return leader && getPlayerTotal(leader.id) >= game.winningScore ? leader : null }
        function ensureMinimumHands() { while (game.hands.length < APP_CONFIG.initialVisibleHands) game.hands.push(createEmptyHand()) }

        function renderGame() {
            ensureMinimumHands();
            scorecardElement.innerHTML = "";
            scorecardElement.style.setProperty("--player-count", game.players.length);
            scorecardElement.className = "scorecard-inner" + (game.players.length > 5 ? " wide" : "");
            renderPlayerHeaders();
            const rows = document.createElement("div"); rows.className = "score-scroll-area";
            renderHands(rows); scorecardElement.appendChild(rows);
            renderTotals(); renderGameStatus();
            requestAnimationFrame(fitPlayerNames);
        }

        function getDisplayedLeader() {
            if (!completedHands().length) return null;
            const totals = getTotals(), high = Math.max(...game.players.map(p => totals[p.id]));
            const leaders = game.players.filter(p => totals[p.id] === high);
            return leaders.length === 1 ? leaders[0] : null;
        }

        function renderPlayerHeaders() {
            const winner = determineWinner(), leader = getDisplayedLeader(), header = document.createElement("div"); header.className = "player-grid";
            const r = document.createElement("div"); r.className = "round-head"; r.textContent = "#"; header.appendChild(r);
            for (const p of game.players) {
                const el = document.createElement("div"); el.className = "player-header" + (p.id === winner?.id ? " winner" : ""); el.title = "Tap to choose a saved player or edit this name";
                const wrap = document.createElement("div"); wrap.className = "player-name-wrap";
                const name = document.createElement("span"); name.className = "player-name-text"; name.textContent = p.name.toUpperCase(); wrap.appendChild(name);
                if (p.id === leader?.id) { const icon = document.createElement("span"); icon.className = "leader-icon"; icon.textContent = getLeaderIcon(); wrap.appendChild(icon) }
                el.appendChild(wrap); el.onclick = () => openPlayerPicker(p.id); header.appendChild(el)
            }
            scorecardElement.appendChild(header)
        }

        function fitPlayerNames() {
            document.querySelectorAll(".player-name-text").forEach(el => {
                el.style.fontSize = "14px";
                let size = 14;
                while (el.scrollWidth > el.clientWidth && size > 8) { size -= .5; el.style.fontSize = `${size}px` }
            })
        }

        function renderHands(container) {
            const winner = determineWinner();
            game.hands.forEach((hand, handIndex) => {
                const row = document.createElement("div"); row.className = "hand-row"; const num = document.createElement("div"); num.className = "round-number"; num.textContent = handIndex + 1; row.appendChild(num);
                game.players.forEach((p, playerIndex) => { const input = document.createElement("input"); input.className = "score-cell" + (p.id === winner?.id ? " winner" : ""); input.type = "number"; input.inputMode = "numeric"; input.autocomplete = "off"; input.placeholder = "—"; input.dataset.handIndex = handIndex; input.dataset.playerIndex = playerIndex; input.dataset.playerId = p.id; const s = hand.scores[p.id]; input.value = s === undefined ? "" : s; input.addEventListener("input", handleScoreInput); input.addEventListener("keydown", handleScoreKeyDown); row.appendChild(input) });
                container.appendChild(row)
            })
        }
        function renderTotals() {
            const winner = determineWinner(),
                totals = getTotals(),
                section = document.createElement("div");

            section.className = "total-section";

            const row = document.createElement("div");
            row.className = "total-row";

            const spacer = document.createElement("div");
            spacer.className = "total-spacer";
            spacer.textContent = "Σ";
            row.appendChild(spacer);

            for (const p of game.players) {
                const el = document.createElement("div");
                el.className = "total-cell" + (p.id === winner?.id ? " winner" : "");
                el.dataset.playerId = p.id;
                el.textContent = totals[p.id];
                row.appendChild(el)
            }

            section.appendChild(row);
            scorecardElement.appendChild(section)
        }
        function showPointsRemaining(el, playerId) {
            const remaining = Math.max(0, game.winningScore - getPlayerTotal(playerId));
            clearTimeout(el._remainingTimer); el.textContent = `${remaining} to go`;
            el._remainingTimer = setTimeout(() => { if (document.body.contains(el)) el.textContent = getPlayerTotal(playerId) }, 2000)
        }

        function renderGameStatus() { gameStatusElement.textContent = "scorecard" }

        function handleScoreInput(e) {
            const input = e.target, handIndex = Number(input.dataset.handIndex), playerId = input.dataset.playerId, value = input.value;
            if (value === "") delete game.hands[handIndex].scores[playerId]; else game.hands[handIndex].scores[playerId] = Number(value);
            updateTotalsOnly(); updateLeaderAce();
            if (!isHandComplete(game.hands[handIndex])) return;
            clearTimeout(newRowTimer);
            newRowTimer = setTimeout(() => { if (!isHandComplete(game.hands[handIndex])) return; if (determineWinner()) { renderGame(); return } if (handIndex === game.hands.length - 1) { game.hands.push(createEmptyHand()); renderGame(); focusScoreCell(game.hands.length - 1, 0) } }, 2000)
        }
        function handleScoreKeyDown(e) { if (e.key !== "Enter") return; e.preventDefault(); moveToNextScoreCell(Number(e.target.dataset.handIndex), Number(e.target.dataset.playerIndex)) }
        function moveToNextScoreCell(handIndex, playerIndex) { if (playerIndex < game.players.length - 1) { focusScoreCell(handIndex, playerIndex + 1); return } const hand = game.hands[handIndex]; if (isHandComplete(hand)) { if (handIndex === game.hands.length - 1 && !determineWinner()) { clearTimeout(newRowTimer); newRowTimer = setTimeout(() => { if (handIndex === game.hands.length - 1 && !determineWinner()) { game.hands.push(createEmptyHand()); renderGame(); focusScoreCell(game.hands.length - 1, 0) } }, 2000); return } focusScoreCell(Math.min(handIndex + 1, game.hands.length - 1), 0); return } focusFirstEmptyCell(handIndex) }
        function focusScoreCell(h, p) { requestAnimationFrame(() => { const el = document.querySelector(`.score-cell[data-hand-index="${h}"][data-player-index="${p}"]`); if (el) { el.focus(); el.select() } }) }
        function focusFirstEmptyCell(h) { const hand = game.hands[h]; for (let i = 0; i < game.players.length; i++) { const v = hand.scores[game.players[i].id]; if (v === undefined || v === "") { focusScoreCell(h, i); return } } }
        function updateTotalsOnly() {
            const totals = getTotals(), winner = determineWinner(), cells = document.querySelectorAll(".total-cell");
            game.players.forEach((p, i) => { if (!cells[i]) return; cells[i].classList.toggle("winner", p.id === winner?.id); cells[i].textContent = String(totals[p.id]) })
        }

        function updateLeaderAce() {
            const leader = getDisplayedLeader();
            document.querySelectorAll(".player-header").forEach((header, i) => {
                header.querySelector(".leader-icon")?.remove();
                header.querySelector(".leader-ace")?.remove();
                if (game.players[i]?.id === leader?.id) { const icon = document.createElement("span"); icon.className = "leader-icon"; icon.textContent = getLeaderIcon(); header.querySelector(".player-name-wrap")?.appendChild(icon) }
            });
            requestAnimationFrame(fitPlayerNames)
        }

        function addPlayer() { if (game.players.length >= APP_CONFIG.maxPlayers) return showMessage(`Maximum of ${APP_CONFIG.maxPlayers} players.`); game.players.push({ id: createId(), name: `Player ${game.players.length + 1}` }); for (const h of game.hands) delete h.scores[game.players[game.players.length - 1].id]; renderGame(); openPlayerPicker(game.players[game.players.length - 1].id); showMessage("Player column added.") }
        function removePlayer() { if (game.players.length <= APP_CONFIG.minPlayers) return showMessage("A game needs at least 2 players."); const names = game.players.map((p, i) => `${i + 1}. ${p.name}`).join("\n"), response = prompt(`Enter player number to remove:\n\n${names}`); if (!response) return; const i = Number(response) - 1; if (i < 0 || i >= game.players.length) return showMessage("That player number is not valid."); const removed = game.players[i]; if (!confirm(`Remove ${removed.name} from this game?`)) return; game.players.splice(i, 1); for (const h of game.hands) delete h.scores[removed.id]; renderGame(); showMessage(`${removed.name} removed.`) }
        function renamePlayer(id) { const p = game.players.find(x => x.id === id); if (!p) return; const name = prompt("Player name:", p.name); if (!name?.trim()) return; p.name = name.trim(); closeModal(); renderGame() }

        function openModal(html) { modalCard.innerHTML = html; modalBackdrop.classList.remove("hidden"); modalBackdrop.setAttribute("aria-hidden", "false") }
        function closeModal() { modalBackdrop.classList.add("hidden"); modalBackdrop.setAttribute("aria-hidden", "true"); modalCard.innerHTML = "" }
        function openPlayerListManager() {
            const saved = playerRepository.load();
            openModal(`<div class="modal-head"><h3>player list</h3><button class="close-btn" data-close-modal>×</button></div><div id="savedPlayerRows">${saved.length ? saved.map((name, i) => `<div class="saved-player"><span style="font-weight:700">${escapeHtml(name)}</span><button class="remove-saved" data-remove-saved="${i}" aria-label="Remove ${escapeHtml(name)}">×</button></div>`).join("") : '<div class="empty-state">No saved players yet.</div>'}</div><div class="player-list-add"><input id="newSavedPlayer" type="text" placeholder="new player name"><button id="saveNewPlayer">add</button></div>`);
            modalCard.querySelector("[data-close-modal]").onclick = closeModal;
            modalCard.querySelectorAll("[data-remove-saved]").forEach(b => b.onclick = () => { const list = playerRepository.load(); list.splice(Number(b.dataset.removeSaved), 1); playerRepository.save(list); openPlayerListManager() });
            $("saveNewPlayer").onclick = () => { const input = $("newSavedPlayer"), name = input.value.trim(); if (!name) return; const list = playerRepository.load(); if (!list.some(x => x.toLowerCase() === name.toLowerCase())) list.push(name); playerRepository.save(list); openPlayerListManager() }
        }
        function openPlayerPicker(playerId) {
            const player = game.players.find(p => p.id === playerId); if (!player) return; const saved = playerRepository.load();
            openModal(`<div class="modal-head"><h3>choose player</h3><button class="close-btn" data-close-modal>×</button></div><div>${saved.length ? saved.map((name, i) => `<div class="saved-player"><button class="saved-player-name" data-pick-saved="${i}">${escapeHtml(name)}</button></div>`).join("") : '<div class="empty-state">No saved players yet.</div>'}</div><button class="manual-name" id="manualNameButton">edit name manually</button><button class="manual-name" id="managePlayersButton">manage player list</button>`);
            modalCard.querySelector("[data-close-modal]").onclick = closeModal;
            modalCard.querySelectorAll("[data-pick-saved]").forEach(b => b.onclick = () => { const name = playerRepository.load()[Number(b.dataset.pickSaved)]; if (name) { player.name = name; closeModal(); renderGame() } });
            $("manualNameButton").onclick = () => renamePlayer(playerId); $("managePlayersButton").onclick = openPlayerListManager
        }
        function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c])) }

        async function saveProgress() { game.status = "active"; game = await gameRepository.save(game); renderGameStatus(); showMessage("Game saved.") }
        async function pauseGame() { game.status = "paused"; game = await gameRepository.save(game); renderGameStatus(); showMessage("Game paused and saved.") }
        function finishGame() {
            if (completedHands().length === 0) return showMessage("Enter at least one complete hand first.");
            const leader = determineLeader();
            openModal(`<div class="modal-head"><h3>end game?</h3><button class="close-btn" data-close-modal>×</button></div><div class="muted" style="line-height:1.5;margin-bottom:14px">Choose whether to save this game to game history or delete it.</div><button class="manual-name" id="saveEndedGame">save game</button><button class="manual-name" id="deleteEndedGame" style="color:var(--red);border-color:var(--red)">delete game</button>`);
            modalCard.querySelector("[data-close-modal]").onclick = closeModal;
            $("saveEndedGame").onclick = () => saveEndedGame(leader?.id || null);
            $("deleteEndedGame").onclick = deleteEndedGame
        }

        async function saveEndedGame(winnerId) {
            closeModal(); game.hands = completedHands(); game.status = "finished"; game.finishedAt = new Date().toISOString(); game.updatedAt = game.finishedAt; game.winnerId = winnerId;
            await gameRepository.archive(game); await gameRepository.deleteCurrentGame();
            game = createNewGame(); ensureMinimumHands(); await gameRepository.save(game); renderGame(); await renderStats(); showPage("score"); showMessage("Game saved.")
        }

        async function deleteEndedGame() {
            closeModal(); await gameRepository.deleteCurrentGame(); game = createNewGame(); ensureMinimumHands(); await gameRepository.save(game); renderGame(); showPage("score"); showMessage("Game deleted.")
        }

        async function deleteGame() { if (!confirm("Delete this game? This cannot be undone.")) return; await gameRepository.deleteCurrentGame(); game = createNewGame(); await gameRepository.save(game); renderGame(); showPage("score") }
        function openSettings() { const value = prompt("Winning score:", game.winningScore); if (!value) return; const score = Number(value); if (!Number.isFinite(score) || score <= 0) return showMessage("Enter a valid winning score."); game.winningScore = score; showMessage(`Winning score set to ${score}.`) }
        function toggleMenu() { gameMenu.classList.toggle("hidden") } function closeMenu() { gameMenu.classList.add("hidden") }
        async function handleMenuAction(e) { const b = e.target.closest("[data-action]"); if (!b) return; closeMenu(); const a = b.dataset.action; if (a === "save") await saveProgress(); else if (a === "pause") await pauseGame(); else if (a === "players") openPlayerListManager(); else if (a === "remove-player") removePlayer(); else if (a === "theme") openThemePicker(); else if (a === "settings") openSettings(); else if (a === "delete") await deleteGame() }
        function showMessage(m) { messageElement.textContent = m; clearTimeout(showMessage.timeout); showMessage.timeout = setTimeout(() => messageElement.textContent = "", 2500) }

        function showPage(page) { currentPage = page; document.querySelectorAll(".page").forEach(x => x.classList.remove("active")); $(`${page}Page`).classList.add("active"); document.querySelectorAll(".nav-btn").forEach(x => x.classList.toggle("active", x.dataset.page === page)); if (page === "score") renderGame(); if (page === "stats") renderStats(); window.scrollTo(0, 0) }
        async function buildStats() { const games = await gameRepository.loadFinishedGames(), map = new Map(); let high = { score: null, name: "" }, low = { score: null, name: "" }; for (const g of games) { const totals = {}; for (const p of g.players) { totals[p.id] = g.hands.reduce((t, h) => t + Number(h.scores[p.id] || 0), 0); if (!map.has(p.name)) map.set(p.name, { name: p.name, games: 0, wins: 0, points: 0 }); const s = map.get(p.name); s.games++; s.points += totals[p.id]; if (p.id === g.winnerId) s.wins++; for (const h of g.hands) { const v = h.scores[p.id]; if (v !== undefined) { if (high.score === null || Number(v) > high.score) high = { score: Number(v), name: p.name }; if (low.score === null || Number(v) < low.score) low = { score: Number(v), name: p.name } } } } } return { games, players: [...map.values()].sort((a, b) => b.wins - a.wins), high, low } }
        let currentStatsTab = "overview";
        async function renderStats() {
            const s = await buildStats();
            document.querySelectorAll("[data-stats-tab]").forEach(b => b.classList.toggle("active", b.dataset.statsTab === currentStatsTab));
            if (currentStatsTab === "player") return renderStatsByPlayer(s);
            if (currentStatsTab === "game") return renderStatsByGame(s);
            const top = s.players[0];
            $("statsOverview").innerHTML = `<div class="stats-grid"><div class="card metric"><label>TOTAL GAMES</label><strong>${s.games.length}</strong><small>played</small></div><div class="card metric"><label>TOP PLAYER</label><strong class="red">${top?.name || "—"}</strong><small>${top ? `${top.wins} wins` : "no games yet"}</small></div><div class="card metric"><label>LOWEST HAND</label><strong>${s.low.score ?? "—"}</strong><small>${s.low.name ? `by ${escapeHtml(s.low.name)}` : "—"}</small></div><div class="card metric"><label>HIGHEST HAND</label><strong class="red">${s.high.score ?? "—"}</strong><small>${s.high.name ? `by ${escapeHtml(s.high.name)}` : "—"}</small></div></div><div class="card player-summary"><div class="section-title" style="margin-bottom:8px">player summary</div><table class="summary-table"><thead><tr><th>player</th><th>games</th><th>wins</th><th>win %</th><th>avg/game</th><th>total pts</th></tr></thead><tbody>${s.players.length ? s.players.map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${p.games}</td><td>${p.wins}</td><td>${Math.round(p.wins / p.games * 100)}%</td><td>${(p.points / p.games).toFixed(1)}</td><td>${p.points}</td></tr>`).join("") : '<tr><td colspan="6">No finished games yet.</td></tr>'}</tbody></table></div>`
        }
        function renderStatsByPlayer(s) {
            $("statsOverview").innerHTML = `<div class="card player-summary"><div class="section-title" style="margin-bottom:8px">by player</div><table class="summary-table"><thead><tr><th>player</th><th>games</th><th>wins</th><th>win %</th><th>avg/game</th><th>total pts</th></tr></thead><tbody>${s.players.length ? s.players.map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${p.games}</td><td>${p.wins}</td><td>${Math.round(p.wins / p.games * 100)}%</td><td>${(p.points / p.games).toFixed(1)}</td><td>${p.points}</td></tr>`).join("") : '<tr><td colspan="6">No finished games yet.</td></tr>'}</tbody></table></div>`
        }
        function renderStatsByGame(s) {
            const games = s.games.slice().sort((a, b) => new Date(b.finishedAt || b.updatedAt) - new Date(a.finishedAt || a.updatedAt));
            $("statsOverview").innerHTML = `<div class="card player-summary"><div class="section-title" style="margin-bottom:8px">by game</div><table class="summary-table"><thead><tr><th>date</th><th>winner</th><th>score</th><th>hands</th></tr></thead><tbody>${games.length ? games.map(g => { const w = g.players.find(p => p.id === g.winnerId); const score = w ? g.hands.reduce((t, h) => t + Number(h.scores[w.id] || 0), 0) : 0; return `<tr class="stats-game-row" data-stats-game-id="${g.id}" style="cursor:pointer"><td>${formatDate(g.finishedAt || g.updatedAt)}</td><td>${escapeHtml(w?.name || "—")}</td><td>${score}</td><td>${g.hands.length}</td></tr>` }).join("") : '<tr><td colspan="4">No finished games yet.</td></tr>'}</tbody></table></div>`;
            $("statsOverview").querySelectorAll("[data-stats-game-id]").forEach(row => row.onclick = () => toggleStatsGameDetail(row, row.dataset.statsGameId, games))
        }

        function toggleStatsGameDetail(row, gameId, games) {
            const existing = row.nextElementSibling;
            if (existing?.classList.contains("stats-game-detail-row")) { existing.remove(); return }
            document.querySelectorAll(".stats-game-detail-row").forEach(el => el.remove());
            const g = games.find(x => x.id === gameId); if (!g) return;
            const winner = g.players.find(p => p.id === g.winnerId);
            const totals = Object.fromEntries(g.players.map(p => [p.id, g.hands.reduce((t, h) => t + Number(h.scores[p.id] || 0), 0)]));
            const detail = document.createElement("tr");
            detail.className = "stats-game-detail-row";
            detail.innerHTML = `<td colspan="4"><div class="inline-game-detail"><div class="inline-game-meta"><span>${formatDateTime(g.finishedAt || g.updatedAt)}</span><span>${escapeHtml(winner?.name || "—")} won</span></div><div class="inline-score-wrap"><table class="inline-score-table"><thead><tr><th>#</th>${g.players.map(p => `<th class="${p.id === g.winnerId ? "winner-col" : ""}">${escapeHtml(p.name)}</th>`).join("")}</tr></thead><tbody>${g.hands.map((h, i) => `<tr><td>${i + 1}</td>${g.players.map(p => `<td class="${p.id === g.winnerId ? "winner-col" : ""}">${h.scores[p.id] ?? "—"}</td>`).join("")}</tr>`).join("")}<tr><td>Σ</td>${g.players.map(p => `<td class="${p.id === g.winnerId ? "winner-col" : ""}"><strong>${totals[p.id]}</strong></td>`).join("")}</tr></tbody></table></div></div></td>`;
            row.insertAdjacentElement("afterend", detail)
        }

        function formatDate(v) { if (!v) return "—"; return new Date(v).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) }
        function formatDateTime(v) { if (!v) return "—"; return new Date(v).toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) }
        async function renderAll() { renderGame(); await renderStats() }
        async function initializeApp() { applyTheme(themeRepository.load()); const saved = await gameRepository.loadCurrentGame(); game = saved && saved.status !== "finished" ? saved : createNewGame(); ensureMinimumHands(); await renderAll(); showPage("score") }

        menuButton.addEventListener("click", e => { e.stopPropagation(); toggleMenu() });
        gameMenu.addEventListener("click", handleMenuAction);
        document.addEventListener("click", e => { if (!gameMenu.contains(e.target) && e.target !== menuButton) closeMenu() });
        modalBackdrop.addEventListener("click", e => { if (e.target === modalBackdrop) closeModal() });
        $("finishButton").onclick = finishGame;
        $("addPlayerButton").onclick = addPlayer;
        document.querySelectorAll("[data-page]").forEach(b => b.addEventListener("click", () => showPage(b.dataset.page)));
        document.querySelectorAll("[data-stats-tab]").forEach(b => b.addEventListener("click", () => { currentStatsTab = b.dataset.statsTab; renderStats() }));
        initializeApp();
    </script>
</body>

</html>
